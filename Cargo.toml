[package]
name = "spokes"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Spokes Todo MCP: one self-hosted tree of to-dos for any MCP-capable model"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
# The 2026-07-28 MCP support is new; pin the SDK exactly and read its changelog before bumping.
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
